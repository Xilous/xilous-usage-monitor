name: Release

# Push to main builds and publishes a release tagged v<Cargo.toml version>,
# unless that tag already exists on the remote, in which case the run builds
# only. So a merge that bumps the version cuts a release, and a merge that
# does not bump is just a build check. Tag push still builds and publishes
# for that tag. workflow_dispatch builds only, leaving the binary as a run
# artifact, so packaging can be exercised without releasing.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Must match RELEASE_ASSET_NAME in src/updater.rs: the in-app updater looks
  # for this exact filename among the release assets and reports no update
  # available if it is missing.
  RELEASE_ASSET_NAME: xilous-usage-monitor.exe
  # The same binary under the app's former name. Installs from before the
  # rename look for this asset, so publishing it lets them update into the
  # renamed app. Drop it once those installs have moved on.
  LEGACY_RELEASE_ASSET_NAME: stealthy-usage-monitor.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # The crate version and the tag are independent, and nothing keeps them
      # in sync. A mismatch matters because the updater compares the release
      # tag against the compiled-in version: tag ahead of the crate and the
      # app re-offers an update it already installed, forever.
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $crateVer = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tagVer = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Cargo.toml version : $crateVer"
          Write-Host "git tag            : $tagVer"
          if ($crateVer -ne $tagVer) {
            throw "Version mismatch: Cargo.toml says $crateVer, tag says $tagVer"
          }

      # Decide whether this run publishes and under which tag. Empty output
      # means build only. Main pushes release v<crate version>; the ls-remote
      # guard makes a merge without a version bump a no-op instead of a
      # duplicate release. The tag the release action then creates uses
      # GITHUB_TOKEN, so it cannot re-trigger this workflow.
      - name: Decide release tag
        id: release_tag
        shell: pwsh
        run: |
          $crateVer = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = ""
          if ("${{ github.event_name }}" -eq "push") {
            if ("${{ github.ref }}".StartsWith("refs/tags/")) {
              $tag = "${{ github.ref_name }}"
            } elseif ("${{ github.ref }}" -eq "refs/heads/main") {
              git ls-remote --exit-code origin "refs/tags/v$crateVer"
              if ($LASTEXITCODE -ne 0) {
                $tag = "v$crateVer"
              } else {
                Write-Host "Tag v$crateVer already exists, building without releasing"
              }
            }
          }
          if ($tag) { Write-Host "This run will publish $tag" } else { Write-Host "Build only" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Build release binary
        run: cargo build --release

      - name: Verify binary exists
        shell: pwsh
        run: |
          $exe = "target/release/${{ env.RELEASE_ASSET_NAME }}"
          if (-not (Test-Path $exe)) { throw "Binary not found at $exe" }
          $kb = [math]::Round((Get-Item $exe).Length / 1KB, 1)
          Write-Host "Built $exe ($kb KB)"

      - uses: actions/upload-artifact@v4
        with:
          name: xilous-usage-monitor
          path: target/release/${{ env.RELEASE_ASSET_NAME }}
          retention-days: 30

      - name: Copy binary under the legacy asset name
        if: steps.release_tag.outputs.tag != ''
        shell: pwsh
        run: Copy-Item "target/release/${{ env.RELEASE_ASSET_NAME }}" "target/release/${{ env.LEGACY_RELEASE_ASSET_NAME }}"

      - name: Create GitHub Release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            target/release/${{ env.RELEASE_ASSET_NAME }}
            target/release/${{ env.LEGACY_RELEASE_ASSET_NAME }}
          generate_release_notes: true
